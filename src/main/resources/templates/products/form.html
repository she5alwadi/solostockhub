<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SoloStock Hub | Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<header class="page-header">
    <div class="container">
        <h1 class="fw-bold">Add New Product</h1>

        <p class="text-muted mb-0">
            Enter the product and inventory information below.
        </p>
    </div>
</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-xl-9">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/products}"
                          th:object="${product}"
                          method="post"
                          novalidate>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label for="name"
                                       class="form-label">
                                    Product Name *
                                </label>

                                <input type="text"
                                       id="name"
                                       th:field="*{name}"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       class="form-control"
                                       placeholder="Enter product name">

                                <div class="invalid-feedback"
                                     th:errors="*{name}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="brandId"
                                       class="form-label">
                                    Brand *
                                </label>

                                <select id="brandId"
                                        name="brandId"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''">

                                    <option value="">
                                        Select a brand
                                    </option>

                                    <option th:each="brand : ${brands}"
                                            th:value="${brand.brandId}"
                                            th:text="${brand.brandName}">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{brand}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="category"
                                       class="form-label">
                                    Category *
                                </label>

                                <select id="category"
                                        th:field="*{category}"
                                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''"
                                        class="form-select">

                                    <option value="">
                                        Select a category
                                    </option>

                                    <option th:each="categoryOption : ${categories}"
                                            th:value="${categoryOption}"
                                            th:text="${categoryOption.displayName}">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{category}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="price"
                                       class="form-label">
                                    Price *
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">$</span>

                                    <input type="number"
                                           id="price"
                                           th:field="*{price}"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                           class="form-control"
                                           min="0.01"
                                           step="0.01"
                                           placeholder="0.00">

                                    <div class="invalid-feedback"
                                         th:errors="*{price}">
                                    </div>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="size"
                                       class="form-label">
                                    Size *
                                </label>

                                <input type="text"
                                       id="size"
                                       th:field="*{size}"
                                       th:classappend="${#fields.hasErrors('size')} ? 'is-invalid' : ''"
                                       class="form-control"
                                       placeholder="Example: Medium">

                                <div class="invalid-feedback"
                                     th:errors="*{size}">
                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="color"
                                       class="form-label">
                                    Color *
                                </label>

                                <input type="text"
                                       id="color"
                                       th:field="*{color}"
                                       th:classappend="${#fields.hasErrors('color')} ? 'is-invalid' : ''"
                                       class="form-control"
                                       placeholder="Example: Black">

                                <div class="invalid-feedback"
                                     th:errors="*{color}">
                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="quantity"
                                       class="form-label">
                                    Quantity *
                                </label>

                                <input type="number"
                                       id="quantity"
                                       th:field="*{quantity}"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''"
                                       class="form-control"
                                       min="0"
                                       max="100000"
                                       placeholder="Enter quantity">

                                <div class="invalid-feedback"
                                     th:errors="*{quantity}">
                                </div>

                            </div>

                            <div class="col-12">

                                <label for="description"
                                       class="form-label">
                                    Description *
                                </label>

                                <textarea id="description"
                                          th:field="*{description}"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          class="form-control"
                                          rows="5"
                                          placeholder="Enter a description of at least 10 characters">
                                </textarea>

                                <div class="invalid-feedback"
                                     th:errors="*{description}">
                                </div>

                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">

                            <button type="submit"
                                    class="btn btn-dark">
                                Save Product
                            </button>

                            <a th:href="@{/products}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<footer>
    <div class="container text-center">
        <p class="mb-0">
            © 2026 SoloStock Hub · Developed by Abdul Daas
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
