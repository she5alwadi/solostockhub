<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="'SoloStock Hub | ' + ${formTitle}">
        Product Form
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<header class="page-header">

    <div class="container">

        <h1 class="fw-bold"
            th:text="${formTitle}">
            Product Form
        </h1>

        <p class="text-muted mb-0">
            Enter and validate the product information below.
        </p>

    </div>

</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-xl-9">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form th:action="${formAction}"
                          th:object="${product}"
                          method="post"
                          novalidate>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label for="name"
                                       class="form-label">
                                    Product Name *
                                </label>

                                <input type="text"
                                       id="name"
                                       th:field="*{name}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{name}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="brandId"
                                       class="form-label">
                                    Brand *
                                </label>

                                <select id="brandId"
                                        name="brandId"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''">

                                    <option value="">
                                        Select a brand
                                    </option>

                                    <option th:each="brand : ${brands}"
                                            th:value="${brand.brandId}"
                                            th:text="${brand.brandName}"
                                            th:selected="${
                                                selectedBrandId != null
                                                and brand.brandId == selectedBrandId
                                                or product.brand != null
                                                and brand.brandId == product.brand.brandId
                                            }">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{brand}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="category"
                                       class="form-label">
                                    Category *
                                </label>

                                <select id="category"
                                        th:field="*{category}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">

                                    <option value="">
                                        Select a category
                                    </option>

                                    <option th:each="option : ${categories}"
                                            th:value="${option}"
                                            th:text="${option.displayName}">
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:errors="*{category}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="price"
                                       class="form-label">
                                    Price *
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        $
                                    </span>

                                    <input type="number"
                                           id="price"
                                           th:field="*{price}"
                                           class="form-control"
                                           min="0.01"
                                           step="0.01"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''">

                                    <div class="invalid-feedback"
                                         th:errors="*{price}">
                                    </div>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="size"
                                       class="form-label">
                                    Size *
                                </label>

                                <input type="text"
                                       id="size"
                                       th:field="*{size}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('size')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{size}">
                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="color"
                                       class="form-label">
                                    Color *
                                </label>

                                <input type="text"
                                       id="color"
                                       th:field="*{color}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('color')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{color}">
                                </div>

                            </div>

                            <div class="col-md-4">

                                <label for="quantity"
                                       class="form-label">
                                    Quantity *
                                </label>

                                <input type="number"
                                       id="quantity"
                                       th:field="*{quantity}"
                                       class="form-control"
                                       min="0"
                                       max="100000"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{quantity}">
                                </div>

                            </div>

                            <div class="col-12">

                                <label for="description"
                                       class="form-label">
                                    Description *
                                </label>

                                <textarea id="description"
                                          th:field="*{description}"
                                          class="form-control"
                                          rows="5"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''">
                                </textarea>

                                <div class="invalid-feedback"
                                     th:errors="*{description}">
                                </div>

                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">

                            <button type="submit"
                                    class="btn btn-dark">

                                Save Product

                            </button>

                            <a th:href="@{/products}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
