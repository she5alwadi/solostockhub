<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SoloStock Hub | Product Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<header class="page-header">

    <div class="container">

        <h1 class="fw-bold">
            Product Details
        </h1>

        <p class="text-muted mb-0">
            Review the selected database record.
        </p>

    </div>

</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-dark text-white py-3">

                    <h3 class="mb-0"
                        th:text="${product.name}">
                        Product
                    </h3>

                </div>

                <div class="card-body p-4">

                    <div class="row g-4">

                        <div class="col-md-6">
                            <strong>Product ID</strong>
                            <p class="text-muted"
                               th:text="${product.productId}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Brand</strong>
                            <p class="text-muted"
                               th:text="${product.brand.brandName}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Category</strong>
                            <p class="text-muted"
                               th:text="${product.category.displayName}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Price</strong>
                            <p class="text-muted"
                               th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Size</strong>
                            <p class="text-muted"
                               th:text="${product.size}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Color</strong>
                            <p class="text-muted"
                               th:text="${product.color}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Quantity</strong>
                            <p class="text-muted"
                               th:text="${product.quantity}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <strong>Created</strong>
                            <p class="text-muted"
                               th:text="${#temporals.format(product.createdAt, 'MMM dd, yyyy HH:mm')}">
                            </p>
                        </div>

                        <div class="col-12">
                            <strong>Description</strong>
                            <p class="text-muted"
                               th:text="${product.description}">
                            </p>
                        </div>

                    </div>

                </div>

                <div class="card-footer bg-white py-3">

                    <div class="d-flex flex-wrap gap-2">

                        <a th:href="@{/products}"
                           class="btn btn-dark">
                            Return to Products
                        </a>

                        <a sec:authorize="hasAnyRole('ADMIN','STAFF')"
                           th:href="@{/products/{id}/edit(id=${product.productId})}"
                           class="btn btn-outline-primary">
                            Edit Product
                        </a>

                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/{id}/delete(id=${product.productId})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this product?');">

                            <button type="submit"
                                    class="btn btn-outline-danger">
                                Delete Product
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
