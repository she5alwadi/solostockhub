<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">

            📦 SoloStock Hub

        </a>

        <span class="badge text-bg-info me-3"
              th:text="${activeProfile + ' PROFILE'}">

            DEV PROFILE

        </span>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="mainNavbar">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/}">

                        Home

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link"
                       th:href="@{/products}">

                        Products

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN','STAFF')">

                    <a class="nav-link"
                       th:href="@{/products/new}">

                        Add Product

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/about}">

                        About

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/contact}">

                        Contact

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link text-warning"
                       th:href="@{/admin}">

                        Admin

                    </a>

                </li>

            </ul>

            <div sec:authorize="isAnonymous()"
                 class="d-flex gap-2">

                <a th:href="@{/login}"
                   class="btn btn-outline-light btn-sm">

                    Login

                </a>

                <a th:href="@{/register}"
                   class="btn btn-light btn-sm">

                    Register

                </a>

            </div>

            <div sec:authorize="isAuthenticated()"
                 class="d-flex align-items-center gap-3">

                <div class="text-light small">

                    Signed in as

                    <strong sec:authentication="name">
                        username
                    </strong>

                    <span class="badge text-bg-light ms-1"
                          sec:authentication="principal.authorities">

                        ROLE

                    </span>

                </div>

                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">

                    <button type="submit"
                            class="btn btn-outline-light btn-sm">

                        Logout

                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

</body>
</html>
