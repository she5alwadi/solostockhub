<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SoloStock Hub | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<header class="page-header">

    <div class="container">

        <h1 class="fw-bold">
            Create an account
        </h1>

        <p class="text-muted mb-0">
            New registrations receive the Customer role.
        </p>

    </div>

</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/register}"
                          th:object="${registrationForm}"
                          method="post"
                          novalidate>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label for="firstName"
                                       class="form-label">
                                    First Name *
                                </label>

                                <input type="text"
                                       id="firstName"
                                       th:field="*{firstName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{firstName}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="lastName"
                                       class="form-label">
                                    Last Name *
                                </label>

                                <input type="text"
                                       id="lastName"
                                       th:field="*{lastName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{lastName}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="username"
                                       class="form-label">
                                    Username *
                                </label>

                                <input type="text"
                                       id="username"
                                       th:field="*{username}"
                                       class="form-control"
                                       autocomplete="username"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{username}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="email"
                                       class="form-label">
                                    Email *
                                </label>

                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       autocomplete="email"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{email}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="password"
                                       class="form-label">
                                    Password *
                                </label>

                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       class="form-control"
                                       autocomplete="new-password"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{password}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label for="confirmPassword"
                                       class="form-label">
                                    Confirm Password *
                                </label>

                                <input type="password"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       class="form-control"
                                       autocomplete="new-password"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback"
                                     th:errors="*{confirmPassword}">
                                </div>

                            </div>

                        </div>

                        <div class="alert alert-info mt-4">

                            Passwords must contain at least
                            eight characters.

                        </div>

                        <div class="d-flex gap-2 mt-4">

                            <button type="submit"
                                    class="btn btn-dark">

                                Create Account

                            </button>

                            <a th:href="@{/login}"
                               class="btn btn-outline-secondary">

                                Return to Login

                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
